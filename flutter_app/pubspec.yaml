name: movie_imposter
description: "Movie Imposter - Offline Party Game"
publish_to: "none"
version: 1.2.4+19

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Courier New
      fonts:
        - asset: assets/fonts/CourierNew-Regular.ttf
        - asset: assets/fonts/CourierNew-Bold.ttf
          weight: 700
